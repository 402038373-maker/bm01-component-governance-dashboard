  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;div class=&quot;complexity-panel&quot; aria-labelledby=&quot;complexity-title&quot;&gt;
      &lt;div class=&quot;section-heading&quot;&gt;
        &lt;h3 id=&quot;complexity-title&quot;&gt;治理难度与代码规模依据&lt;/h3&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;难度来自真实场景分散度、业务封装和开发整改范围，不按组件名称数量估算&lt;/span&gt;
      &lt;/div&gt;
      &lt;p class=&quot;complexity-intro text-small&quot;&gt;一级网并不是直接统一调用一套标准组件：同一语义散落在页面模板、业务组件和服务调用中，且存在自定义样式、固定尺寸、组合组件与无法从菜单直接复现的触发入口。治理需要完成“场景核验 → 组件边界判断 → 规范沉淀 → 代码定位 → 分模块整改与验收”的完整链路。&lt;/p&gt;
      &lt;div class=&quot;code-scale-grid&quot; aria-label=&quot;一级网代码分散规模&quot;&gt;
        &lt;div class=&quot;code-scale-item&quot;&gt;&lt;strong&gt;322&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;图表相关文件 · 横跨 15 个一级模块&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;code-scale-item&quot;&gt;&lt;strong&gt;231&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;Form / Input 相关文件 · 横跨 19 个一级模块&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;code-scale-item&quot;&gt;&lt;strong&gt;122&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;Table 相关文件 · 横跨 16 个一级模块&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;code-scale-item&quot;&gt;&lt;strong&gt;318&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;Modal 相关文件 · 226 个文件含尺寸或关闭策略配置&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;complexity-table&quot; role=&quot;table&quot; aria-label=&quot;组件治理难度分组&quot;&gt;
        &lt;div class=&quot;complexity-row is-head text-small&quot; role=&quot;row&quot;&gt;
          &lt;span role=&quot;columnheader&quot;&gt;治理难度&lt;/span&gt;
          &lt;span role=&quot;columnheader&quot;&gt;组件范围&lt;/span&gt;
          &lt;span role=&quot;columnheader&quot;&gt;代码与页面证据&lt;/span&gt;
          &lt;span role=&quot;columnheader&quot;&gt;为什么工作量大&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;complexity-row&quot; role=&quot;row&quot;&gt;
          &lt;span class=&quot;complexity-level highest&quot; role=&quot;cell&quot;&gt;最高难度&lt;/span&gt;
          &lt;span class=&quot;complexity-components&quot; role=&quot;cell&quot;&gt;Table、图表、地图 / GIS&lt;/span&gt;
          &lt;span class=&quot;code-evidence text-small&quot; role=&quot;cell&quot;&gt;Table 涉及 122 个文件 / 16 个模块；图表涉及 322 个文件 / 15 个模块，BM01 已盘点约 173 个图表页面；GIS / Map 关键词涉及 75 个文件 / 10 个模块。&lt;/span&gt;
          &lt;span class=&quot;complexity-reason text-small&quot; role=&quot;cell&quot;&gt;承载业务数据、交互和页面结构，存在大量列配置、状态、图形语义及地图业务叠加；不能只换视觉样式，必须按场景和数据含义治理。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;complexity-row&quot; role=&quot;row&quot;&gt;
          &lt;span class=&quot;complexity-level high&quot; role=&quot;cell&quot;&gt;较高难度&lt;/span&gt;
          &lt;span class=&quot;complexity-components&quot; role=&quot;cell&quot;&gt;Templates、Card、List、Form、Input、InputNumber、Tree、Upload&lt;/span&gt;
          &lt;span class=&quot;code-evidence text-small&quot; role=&quot;cell&quot;&gt;Form / Input 涉及 231 个文件 / 19 个模块；Tree / TreeSelect 涉及 35 个文件 / 10 个模块；Upload 涉及 55 个文件 / 7 个模块。&lt;/span&gt;
          &lt;span class=&quot;complexity-reason text-small&quot; role=&quot;cell&quot;&gt;组件经常被组合成业务表单和页面模板，同一字段、校验、上传流程或树选择存在多种实现；需要同时治理单组件规则与组合方式。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;complexity-row&quot; role=&quot;row&quot;&gt;
          &lt;span class=&quot;complexity-level medium&quot; role=&quot;cell&quot;&gt;中高难度&lt;/span&gt;
          &lt;span class=&quot;complexity-components&quot; role=&quot;cell&quot;&gt;Collapse、Descriptions&lt;/span&gt;
          &lt;span class=&quot;code-evidence text-small&quot; role=&quot;cell&quot;&gt;BM01 已归档多组真实页面截图，涉及详情、地图侧栏、弹窗和列表展开等不同承载容器。&lt;/span&gt;
          &lt;span class=&quot;complexity-reason text-small&quot; role=&quot;cell&quot;&gt;表面结构简单，但需先区分“折叠信息”“对象属性”“页面布局”的边界，避免把页面结构误当成组件变体。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;complexity-row&quot; role=&quot;row&quot;&gt;
          &lt;span class=&quot;complexity-level implementation&quot; role=&quot;cell&quot;&gt;整改范围大&lt;/span&gt;
          &lt;span class=&quot;complexity-components&quot; role=&quot;cell&quot;&gt;Modal&lt;/span&gt;
          &lt;span class=&quot;code-evidence text-small&quot; role=&quot;cell&quot;&gt;Modal 相关代码涉及 318 个文件；其中 226 个文件出现宽度、Body、遮罩或关闭策略等配置，既有模板式调用，也有服务式动态创建。&lt;/span&gt;
          &lt;span class=&quot;complexity-reason text-small&quot; role=&quot;cell&quot;&gt;治理规范已按确认提示、小表单、中型配置和复杂工作台沉淀，但落地要逐处映射尺寸、滚动、Footer、校验反馈和关闭策略，开发整改面远大于一个组件页面。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;complexity-row&quot; role=&quot;row&quot;&gt;
          &lt;span class=&quot;complexity-level dependency&quot; role=&quot;cell&quot;&gt;依赖后续&lt;/span&gt;
          &lt;span class=&quot;complexity-components&quot; role=&quot;cell&quot;&gt;Colors / 业务颜色&lt;/span&gt;
          &lt;span class=&quot;code-evidence text-small&quot; role=&quot;cell&quot;&gt;基础色、中性色和品牌色已完成；业务色实际依附图表序列、地图状态、告警等级和业务对象语义。&lt;/span&gt;
          &lt;span class=&quot;complexity-reason text-small&quot; role=&quot;cell&quot;&gt;必须先完成图表与业务状态治理，才能确定可复用的颜色语义，提前定义会造成颜色与业务含义再次分裂。&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;scan-note text-small&quot;&gt;代码统计口径：扫描 &lt;code&gt;src/app/routes/civilian&lt;/code&gt; 下的 HTML / TypeScript 文件，按组件选择器、服务名和常见配置关键词统计；“涉及文件”用于说明分散范围，不等同于最终问题数量。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;overview-workflow&quot;&gt;
      &lt;div class=&quot;section-heading&quot;&gt;
        &lt;h3&gt;为什么 1 个组件不等于 1 项工作&lt;/h3&gt;
      &lt;/div&gt;
      &lt;p class=&quot;formula-intro text-small&quot;&gt;每个组件都要从真实页面证据走到开发验收；组件只是治理对象，页面场景、代码分支、变体和跨组件边界才决定实际工作量。&lt;/p&gt;
      &lt;div class=&quot;formula&quot; aria-label=&quot;组件治理工作量链路&quot;&gt;
        &lt;div class=&quot;formula-node&quot;&gt;
          &lt;span class=&quot;formula-step&quot;&gt;01 · 发现&lt;/span&gt;
          &lt;strong&gt;定位真实场景&lt;/strong&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;先确认用户在哪里、因为什么操作看到该组件。&lt;/span&gt;
          &lt;span class=&quot;formula-detail text-small&quot;&gt;菜单入口 · 触发动作 · 页面截图 · 使用数量&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;formula-node&quot;&gt;
          &lt;span class=&quot;formula-step&quot;&gt;02 · 判断&lt;/span&gt;
          &lt;strong&gt;核验代码边界&lt;/strong&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;判断实际调用、参数和状态是否符合组件语义。&lt;/span&gt;
          &lt;span class=&quot;formula-detail text-small&quot;&gt;代码路径 · 组件来源 · 状态参数 · 相邻组件边界&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;formula-node&quot;&gt;
          &lt;span class=&quot;formula-step&quot;&gt;03 · 沉淀&lt;/span&gt;
          &lt;strong&gt;形成治理规范&lt;/strong&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;把分散问题归类，形成可复用、可讲清的统一结论。&lt;/span&gt;
          &lt;span class=&quot;formula-detail text-small&quot;&gt;问题分类 · 使用边界 · Figma 组件 · Token 规则&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;formula-node&quot;&gt;
          &lt;span class=&quot;formula-step&quot;&gt;04 · 闭环&lt;/span&gt;
          &lt;strong&gt;推进开发落地&lt;/strong&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;规范沉淀不是终点，还要让开发能定位、修改并完成验收。&lt;/span&gt;
          &lt;span class=&quot;formula-detail text-small&quot;&gt;统一使用说明 · 问题清单 · 代码整改 · 开发验收&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;formula-note text-small&quot;&gt;工作量主要受三项因素影响：真实使用页面越多、组件变体越杂、与其他组件的语义边界越模糊，治理周期越长。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

        &lt;section class=&quot;dossier-section&quot; aria-label=&quot;可复用问题模式&quot;&gt;
          &lt;div class=&quot;section-heading&quot;&gt;
            &lt;h4&gt;四类可复用“坏习惯”&lt;/h4&gt;
            &lt;span class=&quot;text-small text-muted&quot;&gt;可直接反向指导开发整改&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;dossier-table-wrap&quot;&gt;
            &lt;table class=&quot;dossier-table&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;问题模式&lt;/th&gt;&lt;th&gt;代码证据&lt;/th&gt;&lt;th&gt;影响 / 风险&lt;/th&gt;&lt;th&gt;整改规则&lt;/th&gt;&lt;th&gt;验证状态&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;
                  &lt;td&gt;组件边界混用&lt;/td&gt;
                  &lt;td&gt;&lt;code&gt;station-filter.component.html：tree-select-search、nz-tree-select、nz-select 并存&lt;/code&gt;&lt;/td&gt;
                  &lt;td&gt;相同多选任务出现 checkbox-style Select、树选择和自封装交互，用户认知与维护成本不一致。&lt;/td&gt;
                  &lt;td&gt;无层级关系的标签分组统一使用 Select Multiple；只有真实树层级才使用 TreeSelect。&lt;/td&gt;
                  &lt;td&gt;&lt;span class=&quot;mapping-badge&quot;&gt;规范已形成&lt;/span&gt;&lt;/td&gt;
                &lt;/tr&gt;
                &lt;tr&gt;
                  &lt;td&gt;页面重复补能力&lt;/td&gt;
                  &lt;td&gt;&lt;code&gt;nzDropdownRender 7 处 / 7 文件；“全选”118 处 / 33 文件；“取消全选”16 处 / 7 文件&lt;/code&gt;&lt;/td&gt;
                  &lt;td&gt;全选、搜索和空状态散落在页面模板中，文字、位置与状态逻辑互相不一致。&lt;/td&gt;
                  &lt;td&gt;把 Select All、Search Position、Menu State 收敛到统一业务封装，并固定菜单内布局。&lt;/td&gt;
                  &lt;td&gt;&lt;span class=&quot;mapping-badge extension&quot;&gt;组件扩展已定义&lt;/span&gt;&lt;/td&gt;
                &lt;/tr&gt;
                &lt;tr&gt;
                  &lt;td&gt;溢出与状态规则碎片化&lt;/td&gt;
                  &lt;td&gt;&lt;code&gt;nzMaxTagCount 160 处 / 75 文件；nzMaxTagPlaceholder 109 处 / 47 文件&lt;/code&gt;&lt;/td&gt;
                  &lt;td&gt;+N、N+、省略号、换行与最大高度并存，筛选区和表单的展示策略没有边界。&lt;/td&gt;
                  &lt;td&gt;筛选单行优先 +N；表单允许 3–4 行并内部滚动；单标签不拆分，超长时省略并可查看全文。&lt;/td&gt;
                  &lt;td&gt;&lt;span class=&quot;mapping-badge&quot;&gt;规则已形成&lt;/span&gt;&lt;/td&gt;
                &lt;/tr&gt;
                &lt;tr&gt;
                  &lt;td&gt;设计属性与代码 API 脱节&lt;/td&gt;
                  &lt;td&gt;&lt;code&gt;项目为 Angular 11.2 / ng-zorro 11.4.1；部分 Ant 5 属性不能直接照搬&lt;/code&gt;&lt;/td&gt;
                  &lt;td&gt;Figma 属性如果没有明确代码映射，开发仍会各自实现，无法形成 1:1 发布清单。&lt;/td&gt;
                  &lt;td&gt;每个 Figma 属性必须标注“原生映射 / 组合实现 / 业务扩展 / 不采用”。&lt;/td&gt;
                  &lt;td&gt;&lt;span class=&quot;mapping-badge&quot;&gt;API 已核验&lt;/span&gt;&lt;/td&gt;
                &lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;dossier-section&quot; aria-label=&quot;六类治理专题&quot;&gt;
          &lt;div class=&quot;section-heading&quot;&gt;
            &lt;h4&gt;六类治理专题&lt;/h4&gt;
            &lt;span class=&quot;text-small text-muted&quot;&gt;真实菜单与标准效果见下方证据图库&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;dossier-table-wrap&quot;&gt;
            &lt;table class=&quot;dossier-table&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;专题&lt;/th&gt;&lt;th&gt;真实场景&lt;/th&gt;&lt;th&gt;治理结论&lt;/th&gt;&lt;th&gt;开发验收点&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;01 组件边界&lt;/td&gt;&lt;td&gt;热力站监测 → 标签分组筛选&lt;/td&gt;&lt;td&gt;checkbox-style Select 统一为标准 Select Multiple；无树层级不使用 TreeSelect。&lt;/td&gt;&lt;td&gt;选中态、键盘操作、清空与搜索行为一致。&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;02 Tag Overflow&lt;/td&gt;&lt;td&gt;热源资产、热源出口线、月统计表、热力站历史记录&lt;/td&gt;&lt;td&gt;筛选区使用 Collapse 单行 +N；表单使用 Wrap，可换行 3–4 行并内部滚动；不开放 Selection Limit。&lt;/td&gt;&lt;td&gt;+N 只表示隐藏数量；标签不拆分；全文可悬浮或聚焦查看。&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;03 Select All&lt;/td&gt;&lt;td&gt;热力站监测 → 站点名称；区域管理 → 阀门列表&lt;/td&gt;&lt;td&gt;全选固定在下拉底部，文案不切换成“取消全选”；外置开关移回组件。&lt;/td&gt;&lt;td&gt;未选 / 部分 / 全选三态准确，异步数据变化后状态可恢复。&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;04 Search Position&lt;/td&gt;&lt;td&gt;GIS 对象、所属热网、泵站监测、下位诊断标签&lt;/td&gt;&lt;td&gt;增加 None / Trigger / Dropdown 三档；Trigger 搜索激活时尾部统一显示搜索图标。&lt;/td&gt;&lt;td&gt;焦点、清空、无结果和再次打开后的查询状态一致。&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;05 Option Tag&lt;/td&gt;&lt;td&gt;负荷预测 → 区域；消息配置 → 消息模板&lt;/td&gt;&lt;td&gt;选项允许展示辅助标签；行内“添加 / 移除”特殊业务不纳入通用 Select。&lt;/td&gt;&lt;td&gt;辅助标签只补充语义，不抢占主选项；长文本仍可读。&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;06 Menu State&lt;/td&gt;&lt;td&gt;Select Menu 无结果场景&lt;/td&gt;&lt;td&gt;使用 Options / Empty 表达菜单内容状态；统一图标与 No Data 文案。&lt;/td&gt;&lt;td&gt;无数据、搜索无结果、加载失败不得混为同一状态。&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;dossier-section&quot; aria-label=&quot;Figma 与 Angular API 映射&quot;&gt;
          &lt;div class=&quot;section-heading&quot;&gt;
            &lt;h4&gt;统一语义属性 ↔ Figma ↔ Angular / ng-zorro 11 映射&lt;/h4&gt;
            &lt;span class=&quot;text-small text-muted&quot;&gt;设计属性与建议业务 API 统一词根，底层保留官方 API 名称&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;dossier-table-wrap&quot;&gt;
            &lt;table class=&quot;dossier-table&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;统一语义属性 / Figma 配置&lt;/th&gt;&lt;th&gt;建议业务 API&lt;/th&gt;&lt;th&gt;ng-zorro 11 实现&lt;/th&gt;&lt;th&gt;映射类型&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;Mode = Multiple&lt;/td&gt;&lt;td&gt;&lt;code&gt;[mode]=&quot;&#x27;multiple&#x27;&quot;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;nzMode=&quot;multiple&quot;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mapping-badge&quot;&gt;原生直连&lt;/span&gt;&lt;/td&gt;&lt;td&gt;标准多选，不再用 checkbox-style TreeSelect 代替。&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Tag Overflow = Collapse | Wrap&lt;/td&gt;&lt;td&gt;&lt;code&gt;[tagOverflow]&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;nzMaxTagCount + nzMaxTagPlaceholder&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mapping-badge&quot;&gt;原生组合&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Collapse 使用无边框 +N；Wrap 用于表单多行标签。&lt;/td&gt;&lt;/tr&gt;

        { name: &#x27;Other&#x27;, items: [
          [&#x27;affix&#x27;, &#x27;Affix&#x27;, &#x27;1233:57574&#x27;],
          [&#x27;assets&#x27;, &#x27;Assets&#x27;, &#x27;15247:67&#x27;],
          [&#x27;configProvider&#x27;, &#x27;ConfigProvider&#x27;, &#x27;7120:252&#x27;]
        ] },
        { name: &#x27;Business Components&#x27;, business: true, items: [
          [&#x27;charts&#x27;, &#x27;图表&#x27;, &#x27;24473:7565&#x27;],
          [&#x27;map&#x27;, &#x27;地图 / GIS&#x27;, &#x27;24473:7564&#x27;],
          [&#x27;businessSidebar&#x27;, &#x27;业务管理列表、模块侧栏&#x27;, &#x27;30342:29437&#x27;],
          [&#x27;progress&#x27;, &#x27;Progress（新）&#x27;, &#x27;29288:12893&#x27;]
        ] }
      ];

      const importantKeys = new Set([
        &#x27;button&#x27;, &#x27;templates&#x27;, &#x27;steps&#x27;, &#x27;form&#x27;, &#x27;checkbox&#x27;,
        &#x27;input&#x27;, &#x27;inputNumber&#x27;, &#x27;statistic&#x27;, &#x27;list&#x27;, &#x27;select&#x27;,
        &#x27;switch&#x27;, &#x27;treeSelect&#x27;, &#x27;tree&#x27;, &#x27;upload&#x27;, &#x27;badge&#x27;,
        &#x27;tabs&#x27;, &#x27;card&#x27;, &#x27;collapse&#x27;, &#x27;descriptions&#x27;, &#x27;table&#x27;,
        &#x27;segmented&#x27;, &#x27;radio&#x27;, &#x27;tag&#x27;, &#x27;modal&#x27;, &#x27;charts&#x27;
      ]);

      function governanceLabel(status, progress) {
        if (status === &#x27;done&#x27;) return &#x27;规范已沉淀&#x27;;
        if (status === &#x27;concluded&#x27;) return &#x27;结论已形成&#x27;;
        if (status === &#x27;watch&#x27;) return &#x27;持续关注&#x27;;
        if (status === &#x27;decision&#x27;) return &#x27;待决策&#x27;;
        if (status === &#x27;deferred&#x27;) return &#x27;暂缓治理&#x27;;
        if (status === &#x27;doing&#x27; &amp;&amp; progress &gt; 0) return &#x27;治理中&#x27;;
        return &#x27;待治理&#x27;;
      }

      function make([key, label, pageId], group) {
        const fact = facts[key] || {};
        const status = fact.status || &#x27;doing&#x27;;
        const difficulty = fact.difficulty || 0;
        const marker = fact.marker || (status === &#x27;done&#x27; || status === &#x27;concluded&#x27; ? &#x27;💚&#x27; : status === &#x27;watch&#x27; ? &#x27;💛&#x27; : difficulty ? `⚠ ×${difficulty}` : &#x27;—&#x27;);
        const output = metrics[key] || [0, 0, 0, 0];
        const progress = fact.progress ?? (fact.phaseComplete ? 71 : 0);
        const evidence = evidenceByKey[key] || [];
        return {
          key,
          label,
          pageId,
          group: group.name,
          business: Boolean(group.business),
          status,
          marker,
          governanceLabel: governanceLabel(status, progress),
          importance: importantKeys.has(key) ? &#x27;重要&#x27; : &#x27;一般&#x27;,
          important: importantKeys.has(key),
          showImportance: group.name !== &#x27;Style Guide&#x27;,
          stateLabel: fact.stateLabel || &#x27;待治理&#x27;,
          kind: fact.kind || (group.business ? &#x27;业务组件&#x27; : &#x27;基础组件治理&#x27;),
          summary: fact.summary || &#x27;BM01 中存在正式页面，本轮尚未补充一级网治理说明。&#x27;,
          phaseComplete: Boolean(fact.phaseComplete),
          deep: Boolean(fact.deep),
          difficulty,
          estimate: fact.estimate || &#x27;待评估&#x27;,
          knownDays: fact.knownDays || 0,
          progress,
          output,
          evidence,
          stages: fact.stages || deriveStages(status, progress, evidence.length)
        };
      }

      function deriveStages(status, progress, evidenceCount) {
        if (status === &#x27;done&#x27; || status === &#x27;concluded&#x27;) return [100, 100, 100, 100, 100, 0, 0];
        if (status === &#x27;watch&#x27;) return [100, 60, 40, 0, 0, 0, 0];
        if (status === &#x27;decision&#x27; || status === &#x27;deferred&#x27;) return [20, 0, 0, 0, 0, 0, 0];
        if (progress &gt;= 40) return [100, 80, 60, 20, 0, 0, 0];
        if (progress &gt;= 25) return [100, evidenceCount ? 60 : 30, 30, 0, 0, 0, 0];
        if (progress &gt; 0) return [evidenceCount ? 80 : 30, 20, 0, 0, 0, 0, 0];
        return [0, 0, 0, 0, 0, 0, 0];
      }

      groups.forEach(group =&gt; {
        group.items = group.items.map(item =&gt; make(item, group));
      });
      const allItems = groups.flatMap(group =&gt; group.items);
      const styleGuideItems = groups.find(group =&gt; group.name === &#x27;Style Guide&#x27;).items;
      const reorderableItems = groups
        .filter(group =&gt; group.name !== &#x27;Style Guide&#x27;)
        .flatMap(group =&gt; group.items);
      const reorderableByKey = new Map(reorderableItems.map(item =&gt; [item.key, item]));
      const componentOrderStorageKey = &#x27;bm01-component-nav-order-v1&#x27;;
      const componentGroupingStorageKey = &#x27;bm01-component-nav-groups-v1&#x27;;

      function loadLegacyComponentOrder() {
        const defaultOrder = reorderableItems.map(item =&gt; item.key);
        try {
          const storedOrder = JSON.parse(window.localStorage.getItem(componentOrderStorageKey));
          if (!Array.isArray(storedOrder)) return defaultOrder;
          const knownStoredKeys = storedOrder.filter((key, index) =&gt;
            reorderableByKey.has(key) &amp;&amp; storedOrder.indexOf(key) === index
          );
          const storedKeySet = new Set(knownStoredKeys);
          return [...knownStoredKeys, ...defaultOrder.filter(key =&gt; !storedKeySet.has(key))];
        } catch (error) {
          return defaultOrder;
        }
      }

      function normalizeGroupName(value) {
        return String(value || &#x27;&#x27;).trim().replace(/\s+/g, &#x27; &#x27;).slice(0, 30);
      }

      function createGroupId() {
        return `group-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      }

      function loadComponentLayout() {
        const fallbackOrder = loadLegacyComponentOrder();
        try {
          const stored = JSON.parse(window.localStorage.getItem(componentGroupingStorageKey));
          if (!stored || !Array.isArray(stored.ungrouped) || !Array.isArray(stored.groups)) {
            return { ungrouped: fallbackOrder, groups: [] };
          }
          const usedKeys = new Set();
          const usedIds = new Set();
          const customGroups = stored.groups.map((group, index) =&gt; {
            let id = String(group?.id || `group-${index + 1}`).replace(/[^a-zA-Z0-9_-]/g, &#x27;&#x27;) || `group-${index + 1}`;
            if (usedIds.has(id)) id = `${id}-${index + 1}`;
            usedIds.add(id);
            const name = normalizeGroupName(group?.name) || `&#x5206;&#x7EC4; ${index + 1}`;
            const items = Array.isArray(group?.items) ? group.items.filter(key =&gt; {
              if (!reorderableByKey.has(key) || usedKeys.has(key)) return false;
              usedKeys.add(key);
              return true;
            }) : [];
            return { id, name, items };
          });
          const ungrouped = stored.ungrouped.filter(key =&gt; {
            if (!reorderableByKey.has(key) || usedKeys.has(key)) return false;
            usedKeys.add(key);
            return true;
          });
          fallbackOrder.forEach(key =&gt; {
            if (!usedKeys.has(key)) ungrouped.push(key);
          });
          return { ungrouped, groups: customGroups };
        } catch (error) {
          return { ungrouped: fallbackOrder, groups: [] };
        }
      }

      function saveComponentLayout() {
        try {
          window.localStorage.setItem(componentGroupingStorageKey, JSON.stringify(componentLayout));
          const flattenedOrder = [
            ...componentLayout.ungrouped,
            ...componentLayout.groups.flatMap(group =&gt; group.items)
          ];
          window.localStorage.setItem(componentOrderStorageKey, JSON.stringify(flattenedOrder));
        } catch (error) {
          // Keep the in-memory layout when browser storage is unavailable.
        }
      }

      function getComponentContainer(groupId) {
        if (groupId === &#x27;ungrouped&#x27;) return componentLayout.ungrouped;
        return componentLayout.groups.find(group =&gt; group.id === groupId)?.items || null;
      }

      function getComponentGroupId(key) {
        const customGroup = componentLayout.groups.find(group =&gt; group.items.includes(key));
        return customGroup ? customGroup.id : &#x27;ungrouped&#x27;;
      }

      function escapeHTML(value) {
        return String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, character =&gt; ({
          &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;,
          &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;,
          &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;,
          &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;,
          &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27;
        })[character]);
      }

      let componentLayout = loadComponentLayout();
      const foundationItems = allItems.filter(item =&gt; !item.business);
      let selected = allItems.find(item =&gt; item.key === &#x27;tabs&#x27;);
      let searchTerm = &#x27;&#x27;;
      let initialPage = &#x27;overview-page&#x27;;
      try {
        const params = new URLSearchParams(window.parent.location.search);
        const requested = allItems.find(item =&gt; item.key === params.get(&#x27;component&#x27;));
        if (requested) selected = requested;
        if (params.get(&#x27;page&#x27;) === &#x27;analysis&#x27;) initialPage = &#x27;analysis-page&#x27;;
      } catch (error) {
        initialPage = &#x27;overview-page&#x27;;
      }

      function renderGlobal() {
        const phaseComplete = foundationItems.filter(item =&gt; item.phaseComplete).length;
        const deepCount = foundationItems.filter(item =&gt; item.deep).length;
        const conclusionCount = phaseComplete - deepCount;
        const watchCount = foundationItems.filter(item =&gt; !item.phaseComplete &amp;&amp; item.status === &#x27;watch&#x27;).length;
        const pendingCount = foundationItems.length - phaseComplete - watchCount;
        const verified = foundationItems.filter(item =&gt; item.output[1] &gt; 0);
        const sums = verified.reduce((acc, item) =&gt; acc.map((value, index) =&gt; value + item.output[index]), [0, 0, 0, 0]);
        const knownDays = allItems.reduce((sum, item) =&gt; sum + item.knownDays, 0);
        const coverage = (phaseComplete / foundationItems.length * 100).toFixed(1);

        root.querySelector(&#x27;#kpi-coverage&#x27;).textContent = `${phaseComplete} / ${foundationItems.length}`;
        root.querySelector(&#x27;#kpi-coverage-note&#x27;).textContent = `完成率 ${coverage}% · 含深度治理、复用及无需治理结论`;
        root.querySelector(&#x27;#kpi-deep&#x27;).textContent = `${deepCount} 个`;
        root.querySelector(&#x27;#kpi-output&#x27;).textContent = `${sums[0]} / ${sums[1]}`;
        root.querySelector(&#x27;#kpi-days&#x27;).textContent = &#x27;约 1 个月&#x27;;
        root.querySelector(&#x27;#overview-coverage&#x27;).textContent = `完成阶段结论 ${phaseComplete} / ${foundationItems.length}`;
        root.querySelector(&#x27;#work-sets&#x27;).textContent = sums[0];
        root.querySelector(&#x27;#work-variants&#x27;).textContent = sums[1];
        root.querySelector(&#x27;#work-images&#x27;).textContent = sums[2];
        root.querySelector(&#x27;#work-sections&#x27;).textContent = sums[3];

        const segments = [
          [&#x27;done&#x27;, deepCount, &#x27;深度治理交付&#x27;],
          [&#x27;concluded&#x27;, conclusionCount, &#x27;复用 / 无需治理结论&#x27;],
          [&#x27;watch&#x27;, watchCount, &#x27;持续关注&#x27;],
          [&#x27;doing&#x27;, pendingCount, &#x27;待治理&#x27;]
        ];
        root.querySelector(&#x27;#overview-track&#x27;).innerHTML = segments.map(([status, count]) =&gt;
          `&lt;span class=&quot;seg ${status}&quot; style=&quot;width:${count / foundationItems.length * 100}%&quot;&gt;&lt;/span&gt;`
        ).join(&#x27;&#x27;);
        root.querySelector(&#x27;#overview-track&#x27;).setAttribute(&#x27;aria-label&#x27;, segments.map(([, count, label]) =&gt; `${label}${count}个`).join(&#x27;，&#x27;));
        root.querySelector(&#x27;#overview-legend&#x27;).innerHTML = segments.map(([status, count, label]) =&gt;
          `&lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;dot ${status}&quot;&gt;&lt;/span&gt;${label} ${count}&lt;/span&gt;`
        ).join(&#x27;&#x27;);
      }

      function renderNav() {
        const host = root.querySelector(&#x27;#component-groups&#x27;);
        const draggingEnabled = !searchTerm;
        const matchesSearch = item =&gt; {
          const searchable = `${item.label} ${item.key} ${item.group} ${item.stateLabel} ${item.governanceLabel} ${item.importance} ${item.summary}`.toLowerCase();
          return searchable.includes(searchTerm);
        };
        const visibleUngroupedItems = componentLayout.ungrouped
          .map(key =&gt; reorderableByKey.get(key))
          .filter(item =&gt; item &amp;&amp; matchesSearch(item));
        const visibleCustomGroups = componentLayout.groups.map(group =&gt; {
          const groupMatchesSearch = group.name.toLowerCase().includes(searchTerm);
          const items = group.items
            .map(key =&gt; reorderableByKey.get(key))
            .filter(item =&gt; item &amp;&amp; (groupMatchesSearch || matchesSearch(item)));
          return { ...group, visibleItems: items };
        }).filter(group =&gt; !searchTerm || group.visibleItems.length);
        const visibleStyleGuideItems = styleGuideItems.filter(matchesSearch);
        host.classList.add(&#x27;has-flat-order&#x27;);

        if (!visibleUngroupedItems.length &amp;&amp; !visibleCustomGroups.length &amp;&amp; !visibleStyleGuideItems.length) {
          host.innerHTML = `&lt;div class=&quot;component-search-empty text-small&quot;&gt;未找到匹配组件&lt;/div&gt;`;
          root.querySelector(&#x27;#create-component-group&#x27;).disabled = Boolean(searchTerm);
          return;
        }

        const componentButton = item =&gt; `
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost component-button has-explicit-status ${item.important ? &#x27;is-important&#x27; : &#x27;&#x27;} ${item.showImportance ? &#x27;&#x27; : &#x27;is-style-guide&#x27;}&quot; data-key=&quot;${item.key}&quot; aria-pressed=&quot;${item.key === selected.key}&quot; aria-label=&quot;${item.label}，治理状态：${item.governanceLabel}${item.showImportance ? `，重要程度：${item.importance}` : &#x27;&#x27;}&quot;&gt;
            &lt;span class=&quot;status-sample-main&quot;&gt;
              &lt;span class=&quot;name&quot; title=&quot;${item.label}&quot;&gt;${item.label}&lt;/span&gt;
              &lt;span class=&quot;governance-status status-${item.status}&quot;&gt;${item.governanceLabel}&lt;/span&gt;
            &lt;/span&gt;
            ${item.showImportance ? `&lt;span class=&quot;importance-label text-small ${item.important ? &#x27;is-important&#x27; : &#x27;&#x27;}&quot;&gt;重要程度：${item.importance}&lt;/span&gt;` : &#x27;&#x27;}
          &lt;/button&gt;
        `;
        const componentRow = (item, groupId) =&gt; `
          &lt;div class=&quot;component-sort-row ${draggingEnabled ? &#x27;&#x27; : &#x27;is-drag-disabled&#x27;}&quot; data-sort-key=&quot;${item.key}&quot; data-group-id=&quot;${groupId}&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;component-drag-handle&quot; data-drag-key=&quot;${item.key}&quot; draggable=&quot;${draggingEnabled}&quot; aria-label=&quot;调整 ${item.label} 的顺序&quot; aria-keyshortcuts=&quot;ArrowUp ArrowDown&quot; title=&quot;${draggingEnabled ? &#x27;拖拽调整顺序；也可使用上下方向键&#x27; : &#x27;清空搜索后可调整顺序&#x27;}&quot;&gt;
              &lt;span aria-hidden=&quot;true&quot;&gt;⠿&lt;/span&gt;
            &lt;/button&gt;
            ${componentButton(item)}
          &lt;/div&gt;
        `;

        const showUngroupedLabel = componentLayout.groups.length &gt; 0;
        const ungroupedMarkup = visibleUngroupedItems.length || (!searchTerm &amp;&amp; showUngroupedLabel) ? `
          &lt;section class=&quot;nav-group ungrouped-component-group&quot; aria-label=&quot;未分组&quot;&gt;
            ${showUngroupedLabel ? `&lt;div class=&quot;group-label text-small&quot;&gt;&lt;span&gt;未分组&lt;/span&gt;&lt;span&gt;${componentLayout.ungrouped.length}&lt;/span&gt;&lt;/div&gt;` : &#x27;&#x27;}
            &lt;div class=&quot;component-drop-zone ${visibleUngroupedItems.length ? &#x27;&#x27; : &#x27;is-empty text-small&#x27;}&quot; data-drop-group-id=&quot;ungrouped&quot;&gt;
              ${visibleUngroupedItems.length ? visibleUngroupedItems.map(item =&gt; componentRow(item, &#x27;ungrouped&#x27;)).join(&#x27;&#x27;) : &#x27;拖入组件到未分组区域&#x27;}
            &lt;/div&gt;
          &lt;/section&gt;
        ` : &#x27;&#x27;;

        const customGroupsMarkup = visibleCustomGroups.map(group =&gt; {
          const safeGroupId = escapeHTML(group.id);
          const safeGroupName = escapeHTML(group.name);
          return `
            &lt;section class=&quot;nav-group custom-component-group&quot; data-custom-group-id=&quot;${safeGroupId}&quot; aria-label=&quot;${safeGroupName}&quot;&gt;
              &lt;div class=&quot;custom-group-header&quot;&gt;
                &lt;button type=&quot;button&quot; class=&quot;component-drag-handle custom-group-drag-handle&quot; data-group-drag-key=&quot;${safeGroupId}&quot; draggable=&quot;${draggingEnabled}&quot; aria-label=&quot;调整 ${safeGroupName} 的顺序&quot; aria-keyshortcuts=&quot;ArrowUp ArrowDown&quot; title=&quot;${draggingEnabled ? &#x27;拖拽调整分组顺序&#x27; : &#x27;清空搜索后可调整分组&#x27;}&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;⠿&lt;/span&gt;&lt;/button&gt;
                &lt;span class=&quot;custom-group-name&quot; title=&quot;${safeGroupName}&quot;&gt;${safeGroupName} &lt;span class=&quot;text-small text-muted&quot;&gt;${group.items.length}&lt;/span&gt;&lt;/span&gt;
                &lt;button type=&quot;button&quot; class=&quot;custom-group-action&quot; data-group-action=&quot;rename&quot; data-group-id=&quot;${safeGroupId}&quot; aria-label=&quot;重命名 ${safeGroupName}&quot; title=&quot;重命名&quot; ${draggingEnabled ? &#x27;&#x27; : &#x27;disabled&#x27;}&gt;✎&lt;/button&gt;
                &lt;button type=&quot;button&quot; class=&quot;custom-group-action&quot; data-group-action=&quot;delete&quot; data-group-id=&quot;${safeGroupId}&quot; aria-label=&quot;删除 ${safeGroupName}&quot; title=&quot;删除分组&quot; ${draggingEnabled ? &#x27;&#x27; : &#x27;disabled&#x27;}&gt;&amp;times;&lt;/button&gt;
              &lt;/div&gt;
              &lt;div class=&quot;component-drop-zone ${group.visibleItems.length ? &#x27;&#x27; : &#x27;is-empty text-small&#x27;}&quot; data-drop-group-id=&quot;${safeGroupId}&quot;&gt;
                ${group.visibleItems.length ? group.visibleItems.map(item =&gt; componentRow(item, safeGroupId)).join(&#x27;&#x27;) : &#x27;拖入组件到此分组&#x27;}
              &lt;/div&gt;
            &lt;/section&gt;
          `;
        }).join(&#x27;&#x27;);

        const styleGuideMarkup = visibleStyleGuideItems.length ? `
          &lt;section class=&quot;nav-group fixed-style-guide&quot; aria-label=&quot;Style Guide&quot;&gt;
            &lt;div class=&quot;group-label text-small&quot;&gt;&lt;span&gt;Style Guide&lt;/span&gt;&lt;span&gt;${visibleStyleGuideItems.length}&lt;/span&gt;&lt;/div&gt;
            ${visibleStyleGuideItems.map(componentButton).join(&#x27;&#x27;)}
          &lt;/section&gt;
        ` : &#x27;&#x27;;

        host.innerHTML = customGroupsMarkup + ungroupedMarkup + styleGuideMarkup;
        root.querySelector(&#x27;#create-component-group&#x27;).disabled = Boolean(searchTerm);
        host.querySelectorAll(&#x27;button[data-key]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            selected = allItems.find(item =&gt; item.key === button.dataset.key);
            renderNav();
            renderDetail();
          });
        });
      }

      function clearDropIndicators() {
        root.querySelectorAll(&#x27;.component-sort-row&#x27;).forEach(row =&gt; row.classList.remove(&#x27;is-dragging&#x27;, &#x27;is-drop-before&#x27;, &#x27;is-drop-after&#x27;));
        root.querySelectorAll(&#x27;.custom-component-group&#x27;).forEach(group =&gt; group.classList.remove(&#x27;is-group-dragging&#x27;, &#x27;is-group-drop-before&#x27;, &#x27;is-group-drop-after&#x27;));
        root.querySelectorAll(&#x27;.component-drop-zone&#x27;).forEach(zone =&gt; zone.classList.remove(&#x27;is-drop-target&#x27;));
      }

      function moveComponent(draggedKey, targetGroupId, targetKey = &#x27;&#x27;, placeAfter = false) {
        const sourceContainer = getComponentContainer(getComponentGroupId(draggedKey));
        const targetContainer = getComponentContainer(targetGroupId);
        if (!sourceContainer || !targetContainer || !sourceContainer.includes(draggedKey) || draggedKey === targetKey) return false;
        sourceContainer.splice(sourceContainer.indexOf(draggedKey), 1);
        const targetIndex = targetKey ? targetContainer.indexOf(targetKey) : -1;
        targetContainer.splice(targetIndex === -1 ? targetContainer.length : targetIndex + (placeAfter ? 1 : 0), 0, draggedKey);
        saveComponentLayout();
        return true;
      }

      function moveGroup(draggedId, targetId, placeAfter) {
        const currentIndex = componentLayout.groups.findIndex(group =&gt; group.id === draggedId);
        const targetIndex = componentLayout.groups.findIndex(group =&gt; group.id === targetId);
        if (currentIndex === -1 || targetIndex === -1 || draggedId === targetId) return false;
        const [draggedGroup] = componentLayout.groups.splice(currentIndex, 1);
        const updatedTargetIndex = componentLayout.groups.findIndex(group =&gt; group.id === targetId);
        componentLayout.groups.splice(updatedTargetIndex + (placeAfter ? 1 : 0), 0, draggedGroup);
        saveComponentLayout();
        return true;
      }

      let draggedComponentKey = &#x27;&#x27;;
      let draggedGroupId = &#x27;&#x27;;
      const componentGroupsHost = root.querySelector(&#x27;#component-groups&#x27;);
      componentGroupsHost.addEventListener(&#x27;dragstart&#x27;, event =&gt; {
        const groupHandle = event.target.closest(&#x27;[data-group-drag-key]&#x27;);
        if (groupHandle &amp;&amp; !searchTerm) {
          draggedGroupId = groupHandle.dataset.groupDragKey;
          groupHandle.closest(&#x27;.custom-component-group&#x27;).classList.add(&#x27;is-group-dragging&#x27;);
          event.dataTransfer.effectAllowed = &#x27;move&#x27;;
          event.dataTransfer.setData(&#x27;text/plain&#x27;, draggedGroupId);
          return;
        }
        const handle = event.target.closest(&#x27;[data-drag-key]&#x27;);
        if (!handle || searchTerm) { event.preventDefault(); return; }
        draggedComponentKey = handle.dataset.dragKey;
        handle.closest(&#x27;.component-sort-row&#x27;).classList.add(&#x27;is-dragging&#x27;);
        event.dataTransfer.effectAllowed = &#x27;move&#x27;;
        event.dataTransfer.setData(&#x27;text/plain&#x27;, draggedComponentKey);
      });
      componentGroupsHost.addEventListener(&#x27;dragover&#x27;, event =&gt; {
        if (draggedGroupId) {
          const targetGroup = event.target.closest(&#x27;.custom-component-group&#x27;);
          if (!targetGroup || targetGroup.dataset.customGroupId === draggedGroupId || searchTerm) return;
          event.preventDefault();
          clearDropIndicators();
          root.querySelector(`[data-custom-group-id=&quot;${draggedGroupId}&quot;]`)?.classList.add(&#x27;is-group-dragging&#x27;);
          const bounds = targetGroup.getBoundingClientRect();
          targetGroup.classList.add(event.clientY &gt; bounds.top + bounds.height / 2 ? &#x27;is-group-drop-after&#x27; : &#x27;is-group-drop-before&#x27;);
          event.dataTransfer.dropEffect = &#x27;move&#x27;;
          return;
        }
        const targetRow = event.target.closest(&#x27;.component-sort-row&#x27;);
        const targetZone = event.target.closest(&#x27;.component-drop-zone&#x27;) || event.target.closest(&#x27;.nav-group&#x27;)?.querySelector(&#x27;.component-drop-zone&#x27;);
        if ((!targetRow &amp;&amp; !targetZone) || !draggedComponentKey || targetRow?.dataset.sortKey === draggedComponentKey || searchTerm) return;
        event.preventDefault();
        clearDropIndicators();
        root.querySelector(`[data-sort-key=&quot;${draggedComponentKey}&quot;]`)?.classList.add(&#x27;is-dragging&#x27;);
        if (targetRow) {
          const bounds = targetRow.getBoundingClientRect();
          targetRow.classList.add(event.clientY &gt; bounds.top + bounds.height / 2 ? &#x27;is-drop-after&#x27; : &#x27;is-drop-before&#x27;);
        } else targetZone.classList.add(&#x27;is-drop-target&#x27;);
        event.dataTransfer.dropEffect = &#x27;move&#x27;;
      });
      componentGroupsHost.addEventListener(&#x27;drop&#x27;, event =&gt; {
        if (draggedGroupId) {
          const targetGroup = event.target.closest(&#x27;.custom-component-group&#x27;);
          if (!targetGroup || searchTerm) return;
          event.preventDefault();
          const bounds = targetGroup.getBoundingClientRect();
          if (moveGroup(draggedGroupId, targetGroup.dataset.customGroupId, event.clientY &gt; bounds.top + bounds.height / 2)) renderNav();
          draggedGroupId = &#x27;&#x27;;
          clearDropIndicators();
          return;
        }
        const targetRow = event.target.closest(&#x27;.component-sort-row&#x27;);
        const targetZone = event.target.closest(&#x27;.component-drop-zone&#x27;) || event.target.closest(&#x27;.nav-group&#x27;)?.querySelector(&#x27;.component-drop-zone&#x27;);
        if ((!targetRow &amp;&amp; !targetZone) || !draggedComponentKey || searchTerm) return;
        event.preventDefault();
        const bounds = targetRow?.getBoundingClientRect();
        const targetGroupId = targetRow?.dataset.groupId || targetZone.dataset.dropGroupId;
        const movedItem = reorderableByKey.get(draggedComponentKey);
        if (moveComponent(draggedComponentKey, targetGroupId, targetRow?.dataset.sortKey || &#x27;&#x27;, targetRow ? event.clientY &gt; bounds.top + bounds.height / 2 : true)) {
          root.querySelector(&#x27;#component-order-status&#x27;).textContent = `${movedItem.label} 的分组与顺序已保存`;

      componentGroupsHost.addEventListener(&#x27;dragend&#x27;, () =&gt; {
        draggedComponentKey = &#x27;&#x27;;
        draggedGroupId = &#x27;&#x27;;
        clearDropIndicators();
      });
      componentGroupsHost.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        const groupHandle = event.target.closest(&#x27;[data-group-drag-key]&#x27;);
        if (groupHandle &amp;&amp; !searchTerm &amp;&amp; [&#x27;ArrowUp&#x27;, &#x27;ArrowDown&#x27;].includes(event.key)) {
          event.preventDefault();
          const draggedId = groupHandle.dataset.groupDragKey;
          const currentIndex = componentLayout.groups.findIndex(group =&gt; group.id === draggedId);
          const nextIndex = event.key === &#x27;ArrowUp&#x27; ? currentIndex - 1 : currentIndex + 1;
          if (nextIndex &lt; 0 || nextIndex &gt;= componentLayout.groups.length) return;
          if (moveGroup(draggedId, componentLayout.groups[nextIndex].id, event.key === &#x27;ArrowDown&#x27;)) {
            renderNav();
            root.querySelector(`[data-group-drag-key=&quot;${draggedId}&quot;]`)?.focus();
          }
          return;
        }
        const handle = event.target.closest(&#x27;[data-drag-key]&#x27;);
        if (!handle || searchTerm || ![&#x27;ArrowUp&#x27;, &#x27;ArrowDown&#x27;].includes(event.key)) return;
        event.preventDefault();
        const draggedKey = handle.dataset.dragKey;
        const groupId = getComponentGroupId(draggedKey);
        const container = getComponentContainer(groupId);
        const currentIndex = container.indexOf(draggedKey);
        const nextIndex = event.key === &#x27;ArrowUp&#x27; ? currentIndex - 1 : currentIndex + 1;
        if (nextIndex &lt; 0 || nextIndex &gt;= container.length) return;
        const targetKey = container[nextIndex];
        const movedItem = reorderableByKey.get(draggedKey);
        if (moveComponent(draggedKey, groupId, targetKey, event.key === &#x27;ArrowDown&#x27;)) {
          root.querySelector(&#x27;#component-order-status&#x27;).textContent = `${movedItem.label} 的顺序已保存`;

          `;
        }).join(&#x27;&#x27;);

        host.querySelectorAll(&#x27;[data-tag-evidence-index]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            openEvidenceLightbox(items[Number(button.dataset.tagEvidenceIndex)]);
          });
        });
      }

      function renderCheckboxTopics() {
        const host = root.querySelector(&#x27;#checkbox-topic-board&#x27;);
        const items = imageEvidenceByKey.checkbox || [];
        const evidenceByTopic = items.reduce((groups, item, index) =&gt; {
          (groups[item.topicId] ||= []).push({ ...item, sourceIndex: index });
          return groups;
        }, {});
        const checkboxRuleByTopic = {
          &#x27;01&#x27;: [
            [&#x27;组件责任&#x27;, &#x27;表格行复选框统一使用 Checkbox 组件的行选择模式&#x27;],
            [&#x27;覆盖场景&#x27;, &#x27;pid/名称/时间列的选择列，全选/反选/批量操作&#x27;],
            [&#x27;开发映射&#x27;, &#x27;nz-table + nz-checkbox；真实菜单调用点待逐项核验&#x27;]
          ],
          &#x27;02&#x27;: [
            [&#x27;组件形态&#x27;, &#x27;有层级关系的多选统一使用 TreeSelect 组件&#x27;],
            [&#x27;覆盖场景&#x27;, &#x27;片区分组/东部城区/英集智慧供热等层级勾选&#x27;],
            [&#x27;开发映射&#x27;, &#x27;nz-tree-select；无层级关系的标签分组统一为标准 Select Multiple&#x27;]
          ],
          &#x27;03&#x27;: [
            [&#x27;默认状态&#x27;, &#x27;Checkbox 默认状态统一为组件规范默认态，不得自定义初始状态&#x27;],
            [&#x27;覆盖场景&#x27;, &#x27;弹框内一排 Checkbox（全网/分公司/供热处/中心站/热力站）&#x27;],
            [&#x27;开发映射&#x27;, &#x27;nz-checkbox-group；默认值由业务数据驱动，组件只负责渲染与交互&#x27;]
          ]
        };

        const groupScenarios = topicItems =&gt; topicItems.reduce((groups, item, index) =&gt; {
          const scenarioId = item.scenarioId || String(index + 1).padStart(2, &#x27;0&#x27;);
          const scenario = groups.find(entry =&gt; entry.id === scenarioId);
          if (scenario) {
            scenario.items.push(item);
          } else {
            groups.push({ id: scenarioId, scene: item.scene, items: [item] });
          }
          return groups;
        }, []);

        const renderTopicRule = topicId =&gt; `
          &lt;div class=&quot;modal-topic-rule&quot; aria-label=&quot;${checkboxTopicNames[Number(topicId) - 1]}核心规则&quot;&gt;
            ${(checkboxRuleByTopic[topicId] || []).map(([label, value], index) =&gt; `
              &lt;div class=&quot;modal-topic-rule-item&quot;&gt;
                &lt;span class=&quot;select-topic-label&quot;&gt;${label}&lt;/span&gt;
                ${index === 0 ? `&lt;strong&gt;${value}&lt;/strong&gt;` : `&lt;span&gt;${value}&lt;/span&gt;`}
              &lt;/div&gt;
            `).join(&#x27;&#x27;)}
          &lt;/div&gt;
        `;

        const renderScenarios = (topicId, scenarios) =&gt; scenarios.map(scenario =&gt; `
          &lt;section class=&quot;modal-scenario-group&quot; aria-labelledby=&quot;checkbox-scenario-${topicId}-${scenario.id}&quot;&gt;
            &lt;div class=&quot;modal-scenario-header&quot;&gt;
              &lt;span class=&quot;select-topic-index&quot;&gt;场景 ${scenario.id}&lt;/span&gt;
              &lt;strong id=&quot;checkbox-scenario-${topicId}-${scenario.id}&quot;&gt;${scenario.scene}&lt;/strong&gt;
            &lt;/div&gt;
            &lt;div class=&quot;modal-scenario-evidence${scenario.items.length === 1 ? &#x27; is-single&#x27; : &#x27;&#x27;}&quot;&gt;
              ${scenario.items.map(item =&gt; `
                &lt;button type=&quot;button&quot; class=&quot;evidence-card&quot; data-checkbox-evidence-index=&quot;${item.sourceIndex}&quot; aria-label=&quot;查看大图：${item.title}&quot;&gt;
                  &lt;img class=&quot;evidence-image&quot; src=&quot;${item.src}&quot; alt=&quot;${item.title} 一级网真实页面证据&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot;&gt;
                  &lt;span class=&quot;evidence-caption&quot;&gt;
                    &lt;strong class=&quot;${item.title.startsWith(&#x27;当前问题&#x27;) ? &#x27;is-problem&#x27; : &#x27;is-standard&#x27;}&quot;&gt;${item.title}&lt;/strong&gt;
                    &lt;span class=&quot;text-small&quot;&gt;${item.note}&lt;/span&gt;
                  &lt;/span&gt;
                &lt;/button&gt;
              `).join(&#x27;&#x27;)}
            &lt;/div&gt;
          &lt;/section&gt;
        `).join(&#x27;&#x27;);

        const traceMarkup = issueItem =&gt; `
          &lt;div class=&quot;select-topic-trace&quot;&gt;
            &lt;div class=&quot;select-topic-field&quot;&gt;&lt;span class=&quot;select-topic-label&quot;&gt;页面 / 场景&lt;/span&gt;&lt;span class=&quot;select-topic-value&quot;&gt;${issueItem.page}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;select-topic-field&quot;&gt;&lt;span class=&quot;select-topic-label&quot;&gt;治理判断&lt;/span&gt;&lt;span class=&quot;select-topic-value&quot;&gt;${issueItem.judgement}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;select-topic-field&quot;&gt;&lt;span class=&quot;select-topic-label&quot;&gt;定位 / 证据&lt;/span&gt;&lt;span class=&quot;select-topic-value&quot;&gt;&lt;code&gt;${issueItem.trace}&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;select-topic-field&quot;&gt;&lt;span class=&quot;select-topic-label&quot;&gt;状态 / 下一步&lt;/span&gt;&lt;span class=&quot;select-topic-value&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;${issueItem.next}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        `;

        host.innerHTML = selected.evidence.map((issueItem, index) =&gt; {
          const topicId = String(index + 1).padStart(2, &#x27;0&#x27;);
          const topicItems = evidenceByTopic[topicId] || [];
          const scenarios = groupScenarios(topicItems);
          return `
            &lt;section class=&quot;select-topic-group&quot; aria-labelledby=&quot;checkbox-topic-${topicId}&quot;&gt;
              &lt;div class=&quot;select-topic-header&quot;&gt;
                &lt;div class=&quot;select-topic-title&quot;&gt;
                  &lt;span class=&quot;select-topic-index&quot;&gt;专题 ${topicId}&lt;/span&gt;
                  &lt;h4 id=&quot;checkbox-topic-${topicId}&quot;&gt;${checkboxTopicNames[index] || issueItem.page}&lt;/h4&gt;
                &lt;/div&gt;
                &lt;span class=&quot;text-small text-muted&quot;&gt;${topicItems.length} 张证据 · ${scenarios.length} 组场景&lt;/span&gt;
              &lt;/div&gt;
              ${renderTopicRule(topicId)}
              &lt;div class=&quot;modal-scenario-list&quot;&gt;${renderScenarios(topicId, scenarios)}&lt;/div&gt;
              ${traceMarkup(issueItem)}
            &lt;/section&gt;
          `;
        }).join(&#x27;&#x27;);

        host.querySelectorAll(&#x27;[data-checkbox-evidence-index]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            openEvidenceLightbox(items[Number(button.dataset.checkboxEvidenceIndex)]);
          });
        });
      }

      function renderDetail() {
        root.querySelector(&#x27;#standard-governance-dossier&#x27;).hidden = selected.key !== &#x27;select&#x27;;
        root.querySelector(&#x27;#selected-name&#x27;).textContent = selected.label;
        root.querySelector(&#x27;#selected-state&#x27;).textContent = selected.stateLabel;
        root.querySelector(&#x27;#selected-summary&#x27;).textContent = selected.summary;
        root.querySelector(&#x27;#selected-percent&#x27;).textContent = `${selected.progress}%`;
        root.querySelector(&#x27;#selected-kind&#x27;).textContent = selected.kind;
        root.querySelector(&#x27;#selected-effort&#x27;).textContent = selected.difficulty ? `⚠ ×${selected.difficulty}` : selected.phaseComplete ? &#x27;已形成结论&#x27; : &#x27;待评估&#x27;;
        root.querySelector(&#x27;#selected-estimate&#x27;).textContent = selected.estimate;
        root.querySelector(&#x27;#selected-dot&#x27;).className = `dot ${selected.status}`;

        root.querySelector(&#x27;#stage-flow&#x27;).innerHTML = stageNames.map((name, index) =&gt; {
          const value = selected.stages[index];
          let label = value &gt;= 100 ? &#x27;完成&#x27; : value &gt; 0 ? &#x27;进行中&#x27; : &#x27;待开始&#x27;;
          if (selected.status === &#x27;deferred&#x27; &amp;&amp; index &gt; 0) label = &#x27;后置&#x27;;
          if (selected.status === &#x27;decision&#x27; &amp;&amp; index &gt; 0) label = &#x27;待决策&#x27;;
          return `
            &lt;div class=&quot;stage ${stageClass(value)}&quot;&gt;
              &lt;span class=&quot;stage-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
              &lt;strong&gt;${name}&lt;/strong&gt;
              &lt;span class=&quot;text-small&quot;&gt;${label}&lt;/span&gt;
            &lt;/div&gt;
          `;
        }).join(&#x27;&#x27;);

        renderOutput();
        const isSelect = selected.key === &#x27;select&#x27;;
        const isModal = selected.key === &#x27;modal&#x27;;
        const isStatistic = selected.key === &#x27;statistic&#x27;;
        const isTabs = selected.key === &#x27;tabs&#x27;;
        const isRadio = selected.key === &#x27;radio&#x27;;
        const isSegmented = selected.key === &#x27;segmented&#x27;;
        const isSwitch = selected.key === &#x27;switch&#x27;;
        const isBadge = selected.key === &#x27;badge&#x27;;
        const isTag = selected.key === &#x27;tag&#x27;;
        const isCheckbox = selected.key === &#x27;checkbox&#x27;;
        root.querySelector(&#x27;#select-topic-section&#x27;).hidden = !isSelect;
        root.querySelector(&#x27;#modal-topic-section&#x27;).hidden = !isModal;
        root.querySelector(&#x27;#statistic-topic-section&#x27;).hidden = !isStatistic;
        root.querySelector(&#x27;#tabs-topic-section&#x27;).hidden = !isTabs;
        root.querySelector(&#x27;#radio-topic-section&#x27;).hidden = !isRadio;
        root.querySelector(&#x27;#segmented-topic-section&#x27;).hidden = !isSegmented;
        root.querySelector(&#x27;#switch-topic-section&#x27;).hidden = !isSwitch;
        root.querySelector(&#x27;#badge-topic-section&#x27;).hidden = !isBadge;
        root.querySelector(&#x27;#tag-topic-section&#x27;).hidden = !isTag;
        root.querySelector(&#x27;#checkbox-topic-section&#x27;).hidden = !isCheckbox;
        root.querySelector(&#x27;#evidence-section&#x27;).hidden = isSelect || isModal || isStatistic || isTabs || isRadio || isSegmented || isSwitch || isBadge || isTag || isCheckbox;
        root.querySelector(&#x27;#issue-section&#x27;).hidden = isSelect || isModal || isStatistic || isTabs || isRadio || isSegmented || isSwitch || isBadge || isTag || isCheckbox;
        if (isSelect) {
          renderSelectTopics();
        } else if (isModal) {
          renderModalConfirmationTopic();
        } else if (isStatistic) {
          renderStatisticTopics();
        } else if (isTabs) {
          renderTabsTopics();
        } else if (isRadio) {
          renderRadioTopics();
        } else if (isSegmented) {
          renderSegmentedTopics();
        } else if (isSwitch) {
          renderSwitchTopics();
        } else if (isBadge) {
          renderBadgeTopics();
        } else if (isTag) {
          renderTagTopics();
        } else if (isCheckbox) {
          renderCheckboxTopics();
        } else {
          renderImageEvidence();
        }

        const issueHost = root.querySelector(&#x27;#issue-rows&#x27;);
        if (!isSelect &amp;&amp; !isModal &amp;&amp; !isStatistic &amp;&amp; !isTabs &amp;&amp; !isRadio &amp;&amp; !isSegmented &amp;&amp; !isSwitch &amp;&amp; !isBadge &amp;&amp; !isTag &amp;&amp; !isCheckbox &amp;&amp; !selected.evidence.length) {
          issueHost.innerHTML = `
            &lt;tr&gt;
              &lt;td&gt;${selected.label}&lt;/td&gt;
              &lt;td&gt;${selected.summary}&lt;/td&gt;
              &lt;td&gt;&lt;code&gt;BM01 页面 ${selected.pageId}&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;${selected.phaseComplete ? &#x27;结论已形成&#x27; : &#x27;待补真实证据&#x27;}&lt;/span&gt;&lt;/td&gt;
            &lt;/tr&gt;
          `;
        } else if (!isSelect &amp;&amp; !isModal &amp;&amp; !isStatistic &amp;&amp; !isTabs &amp;&amp; !isRadio &amp;&amp; !isSegmented &amp;&amp; !isSwitch &amp;&amp; !isBadge &amp;&amp; !isTag &amp;&amp; !isCheckbox) {
          issueHost.innerHTML = selected.evidence.map(item =&gt; `
            &lt;tr&gt;
              &lt;td&gt;${item.page}&lt;/td&gt;
              &lt;td&gt;${item.judgement}&lt;/td&gt;
              &lt;td&gt;&lt;code&gt;${item.trace}&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;${item.next}&lt;/span&gt;&lt;/td&gt;
            &lt;/tr&gt;
          `).join(&#x27;&#x27;);
        }
        if (window.lucide) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      root.querySelector(&#x27;#lightbox-close&#x27;).addEventListener(&#x27;click&#x27;, closeEvidenceLightbox);
      root.querySelector(&#x27;#evidence-lightbox&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        if (event.target.id === &#x27;evidence-lightbox&#x27;) closeEvidenceLightbox();
      });
      document.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key === &#x27;Escape&#x27; &amp;&amp; !root.querySelector(&#x27;#evidence-lightbox&#x27;).hidden) {
          closeEvidenceLightbox();
        }
      });

      renderGlobal();
      renderNav();
      renderDetail();
      showPage(initialPage);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
